version: 2
updates:
  # Pinned actions in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base images: the app's Dockerfile and the CI image (both node:26-alpine)
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/.github/ci"
    schedule:
      interval: "weekly"

  # npm dev dependencies (TypeScript and @types/node for type checking)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

version: 2
updates:
  # Pinned actions in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base image in the Dockerfile (node:22-alpine)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # npm dependencies (none yet; kept so new ones are watched automatically)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

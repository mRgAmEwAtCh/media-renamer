# Media Renamer for openmediavault (compose plugin) or plain `docker compose`.
# Values come from .env next to this file, or from the OMV compose "Environment" field.
services:
  media-renamer:
    build: .
    # Set MEDIA_RENAMER_IMAGE=ghcr.io/mrgamewatch/media-renamer:latest to pull the published image instead of building.
    image: ${MEDIA_RENAMER_IMAGE:-media-renamer:latest}
    container_name: media-renamer
    # Stable hostname: lets a restarted or recreated container recognise its own stale job lock.
    hostname: media-renamer
    restart: unless-stopped
    init: true
    # A running move may finish its current file on `docker stop` (see MEDIA_RENAMER_SHUTDOWN_GRACE).
    stop_grace_period: 10m
    user: "${PUID:-1000}:${PGID:-100}"
    ports:
      - "${MEDIA_RENAMER_PORT:-4173}:4173"
    environment:
      # The web UI may only browse, rename and move inside these container folders.
      # Single-mount setup (whole disk or pool as MEDIA_PATH, so moves are instant
      # renames): list the shares here, e.g. /media/Downloads,/media/TV,/media/Movies.
      MEDIA_RENAMER_ROOTS: ${MEDIA_RENAMER_ROOTS:-/media,/library}
      # Default destinations per kind (empty = rename in place). The web UI's
      # "Save as default" overrides these and the patterns below; it saves to /config.
      MEDIA_RENAMER_TV_TARGET: ${MEDIA_RENAMER_TV_TARGET:-}
      MEDIA_RENAMER_MOVIE_TARGET: ${MEDIA_RENAMER_MOVIE_TARGET:-}
      MEDIA_RENAMER_EPISODE_PATTERN: ${MEDIA_RENAMER_EPISODE_PATTERN:-}
      MEDIA_RENAMER_MOVIE_PATTERN: ${MEDIA_RENAMER_MOVIE_PATTERN:-}
      # File filters (UI defaults; CLI flags override): video files only, keep/skip samples.
      MEDIA_RENAMER_VIDEO_ONLY: ${MEDIA_RENAMER_VIDEO_ONLY:-false}
      MEDIA_RENAMER_INCLUDE_SAMPLES: ${MEDIA_RENAMER_INCLUDE_SAMPLES:-false}
      # Metadata language (e.g. de-DE) and movie release region (e.g. DE).
      MEDIA_RENAMER_LANGUAGE: ${MEDIA_RENAMER_LANGUAGE:-en-US}
      MEDIA_RENAMER_REGION: ${MEDIA_RENAMER_REGION:-}
      # Seconds the current file may take to finish on stop; keep below stop_grace_period.
      MEDIA_RENAMER_SHUTDOWN_GRACE: 570
      MEDIA_RENAMER_ALLOWED_HOSTS: ${MEDIA_RENAMER_ALLOWED_HOSTS:-}
      MEDIA_RENAMER_PASSWORD: ${MEDIA_RENAMER_PASSWORD:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      # Automatic import: a downloader POSTs to /api/hooks/extracted with this token.
      # Empty = hook disabled. PATH_MAP translates the downloader's paths, e.g. /Downloads=/media/Downloads.
      MEDIA_RENAMER_HOOK_TOKEN: ${MEDIA_RENAMER_HOOK_TOKEN:-}
      MEDIA_RENAMER_PATH_MAP: ${MEDIA_RENAMER_PATH_MAP:-}
      MEDIA_RENAMER_STABLE_SECONDS: ${MEDIA_RENAMER_STABLE_SECONDS:-10}
      MEDIA_RENAMER_AUTO_IMPORT: ${MEDIA_RENAMER_AUTO_IMPORT:-true}
      MEDIA_RENAMER_AUTO_INCLUDE_WARNINGS: ${MEDIA_RENAMER_AUTO_INCLUDE_WARNINGS:-false}
      MEDIA_RENAMER_CLEANUP_EMPTY_FOLDERS: ${MEDIA_RENAMER_CLEANUP_EMPTY_FOLDERS:-false}
      # Add a Dolby Digital Plus (E-AC-3) track to files whose audio in these languages is DTS only.
      MEDIA_RENAMER_AUDIO_FIX: ${MEDIA_RENAMER_AUDIO_FIX:-false}
      MEDIA_RENAMER_AUDIO_FIX_EPISODES: ${MEDIA_RENAMER_AUDIO_FIX_EPISODES:-false}
      MEDIA_RENAMER_AUDIO_LANGUAGES: ${MEDIA_RENAMER_AUDIO_LANGUAGES:-}
      MEDIA_RENAMER_AUDIO_BITRATE: ${MEDIA_RENAMER_AUDIO_BITRATE:-1024k}
      UMASK: ${UMASK:-002}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      # Incoming files to rename (e.g. your downloads share), or a whole disk/pool.
      - ${MEDIA_PATH:?Set MEDIA_PATH to your incoming media shared folder}:/media
      # Where renamed files can be moved (e.g. your library share). Defaults to MEDIA_PATH.
      # Moves between /media and /library are copies even on the same disk; for instant
      # moves, mount one parent folder as MEDIA_PATH and keep destinations under /media.
      - ${LIBRARY_PATH:-${MEDIA_PATH}}:/library
      # Saved settings. Create the folder first (mkdir -p config) so it belongs to PUID.
      - ./config:/config
    # Hardening: the app only needs to read its code and write to the mounted folders.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
